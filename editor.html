<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEDRINK — редактор меню</title><link rel="stylesheet" href="editor.css?v=1"></head><body>
<main class="editor-shell"><header><a href="index.html">← На сайт</a><h1>Редактор меню</h1><button id="logout" hidden>Выйти</button></header>
<section id="access" class="panel"><h2>Доступ редактора</h2><p>Сайт отправит персональную ссылку на разрешённый email. После перехода доступ сохранится в этом браузере.</p><button id="magicLink">Получить ссылку на kurtkabeya@gmail.com</button><p id="accessStatus"></p></section>
<section id="editor" hidden><form id="itemForm" class="panel"><h2>Новая позиция</h2><div class="form-grid">
<label>Название<input name="name" required></label><label>Категория<select name="category"><option value="fruit">Фруктовые чаи</option><option value="cocktail">Коктейли</option><option value="milk">Молочные чаи</option><option value="icecream">Мороженое</option></select></label>
<label>Цена, ₸<input name="price" type="number" min="0" required></label><label>Объём<input name="volume" placeholder="500 мл"></label>
<label class="wide">Описание<textarea name="description"></textarea></label><label>Фото<input name="image" type="file" accept="image/*"></label><label>Видео<input name="video" type="file" accept="video/*"></label>
</div><button type="submit">Добавить в меню</button><p id="formStatus"></p></form><section class="panel"><h2>Позиции из базы</h2><div id="items"></div></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script><script src="editor.js?v=1"></script></body></html>
