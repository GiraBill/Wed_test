<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Закрытый редактор меню WEDRINK">
  <title>WEDRINK — редактор меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260813-8">
  <link rel="stylesheet" href="editor.css?v=3">
</head>
<body>
  <main class="editor-shell">
    <header class="editor-header">
      <nav class="topbar" aria-label="Навигация редактора">
        <a class="brand" href="index.html" aria-label="WEDRINK — на главную"><span class="brand-logo" aria-hidden="true"></span></a>
        <div class="header-actions">
          <a class="mini-link" href="index.html">На сайт <span>↗</span></a>
          <button class="quiet-button" id="logout" hidden>Выйти</button>
        </div>
      </nav>
    </header>

    <section id="access" class="access-card">
      <div class="access-icon">↗</div>
      <div>
        <p class="eyebrow">Безопасный вход</p>
        <h2>Доступ редактора</h2>
        <p>Отправим персональную ссылку на разрешённую почту. После перехода доступ сохранится в этом браузере.</p>
      </div>
      <button id="magicLink">Получить ссылку</button>
      <p class="status-message" id="accessStatus"></p>
    </section>

    <section id="editor" hidden>
      <div class="workspace-heading">
        <div><p class="eyebrow">Редактор меню</p><h1 class="page-title">Новая позиция</h1></div>
      </div>

      <form id="itemForm" class="editor-card">
        <div class="form-grid">
          <label><span>Название</span><input name="name" placeholder="Например, Манго-кокос" required></label>
          <label><span>Категория</span><select name="category"><option value="fruit">Фруктовые чаи</option><option value="cocktail">Коктейли</option><option value="milk">Молочные чаи</option><option value="icecream">Мороженое</option></select></label>
          <label><span>Цена, ₸</span><input name="price" type="number" min="0" placeholder="900" required></label>
          <label><span>Объём</span><input name="volume" placeholder="500 мл"></label>
          <label class="wide"><span>Описание</span><textarea name="description" placeholder="Коротко расскажите о вкусе и составе"></textarea></label>
          <label class="upload-field"><span>Фото продукта</span><input name="image" type="file" accept="image/*"><small>JPG, PNG или WEBP</small></label>
          <label class="upload-field"><span>Видео продукта</span><input name="video" type="file" accept="video/*"><small>MP4 или WEBM</small></label>
        </div>
        <div class="form-actions">
          <button class="primary-button" type="submit"><span>＋</span> Добавить в меню</button>
          <p class="status-message" id="formStatus"></p>
        </div>
      </form>

      <section class="items-section">
        <div class="workspace-heading compact">
          <div><p class="eyebrow">Управление</p><h2>Позиции из базы</h2></div>
          <p>Здесь можно временно скрыть продукт или удалить его полностью.</p>
        </div>
        <div class="editor-card items-card"><div id="items"></div></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="editor.js?v=1"></script>
</body>
</html>
